name: Set up release musl cross-compiler
description: Install the checksum-pinned musl toolchain for the Go target
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cc=$(scripts/setup-musl.sh "$RUNNER_TEMP/dae-musl")
        echo "CC=$cc" >> "$GITHUB_ENV"
        echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
        echo "STATIC=y" >> "$GITHUB_ENV"
