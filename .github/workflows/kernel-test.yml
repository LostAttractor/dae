name: Kernel Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: &non-runtime
      - 'docs/en/**'
      - 'docs/zh/**'
      - '**/*.md'
  push:
    branches: [next]
    paths-ignore: *non-runtime

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-check:
    name: Kernel check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [kernel-control-lts, kernel-control-latest, kernel-proxy]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare VM runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Leave room for the guest kernel and the Go/LLVM build closure.
          sudo rm -rf /usr/local/lib/android/sdk

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Run NixOS VM check
        env:
          CHECK: ${{ matrix.check }}
        run: nix build -L --no-link ".#checks.x86_64-linux.$CHECK"

  # Retain the existing check name for branch protection.
  kernel:
    needs: kernel-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all kernel checks to pass
        env:
          RESULT: ${{ needs.kernel-check.result }}
        run: test "$RESULT" = success
