name: Kernel Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: &non-runtime
      - 'docs/en/**'
      - 'docs/zh/**'
      - '**/*.md'
  push:
    branches: [next]
    paths-ignore: *non-runtime

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare VM runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Leave room for two guest kernels and the Go/LLVM build closure.
          sudo rm -rf /usr/local/lib/android/sdk

      - id: nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Privileged tests on the LTS kernel
        run: nix build -L --no-link .#checks.x86_64-linux.kernel-control-lts

      - name: Privileged tests on the latest pinned kernel
        if: ${{ !cancelled() && steps.nix.outcome == 'success' }}
        run: nix build -L --no-link .#checks.x86_64-linux.kernel-control-latest

      - name: Dual-stack LAN and WAN via sing-box
        if: ${{ !cancelled() && steps.nix.outcome == 'success' }}
        run: nix build -L --no-link .#checks.x86_64-linux.kernel-proxy
