name: eBPF Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - ".gitmodules"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "scripts/ebpf-audit.sh"
      - ".github/workflows/ebpf-audit.yml"
      - "kern/headers"
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - ".gitmodules"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "scripts/ebpf-audit.sh"
      - ".github/workflows/ebpf-audit.yml"
      - "kern/headers"

permissions: read-all

jobs:
  ebpf-audit:
    name: Load, Verifier, and Dump Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.2'

      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm

      - name: Build eBPF audit
        env:
          EBPF_AUDIT_PHASE: build
        run: make ebpf-audit

      - name: Run eBPF audit on a supported kernel
        uses: cilium/little-vm-helper@v0.0.28
        with:
          test-name: dae-ebpf-audit
          image-version: '6.18-20260810.013220'
          host-mount: ./
          install-dependencies: 'true'
          cmd: |
            apt-get update
            apt-get install -y bpftool
            git config --global --add safe.directory /host
            cd /host
            EBPF_AUDIT_PHASE=run ./scripts/ebpf-audit.sh

      - name: Upload eBPF audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ebpf-audit
          path: build/ebpf-audit
