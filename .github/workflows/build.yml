name: Build (Next)

on:
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "third_party/**"
      - "web/**"
      - "plugins.cfg.*"
      - "plugins/**"
      - "pkg/config_parser/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "install/release-targets.json"
      - ".github/workflows/build.yml"
      - ".github/workflows/seed-build.yml"
      - "Makefile"
      - "scripts/setup-*.sh"
      - "scripts/*-cc.sh"
      - "scripts/check-static.sh"
      - "scripts/run-target.sh"
      - "scripts/release-checksums.sh"
      - "scripts/tests/test_release_pipeline.py"
      - ".github/actions/**"
      - "kern/headers"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/seed-build.yml
    with:
      ref: ${{ github.sha }}
      build-type: main-build
