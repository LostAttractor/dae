name: BPF Test

on:
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "control/kern/tests/*.go"
      - ".github/workflows/bpf-test.yml"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "kern/headers"
  push:
    branches:
      - next
    paths:
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "control/kern/tests/*.go"
      - ".github/workflows/bpf-test.yml"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "kern/headers"

permissions: read-all

jobs:
  build:
    name: Build BPF tests (Clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    outputs:
      artifacts: ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        llvm: [15, 16, 17, 18, 19, 20, 21, 22, 23]

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.2'

      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ matrix.llvm }}

      - name: Build BPF tests
        run: |
          make ebpf-test-build
          mv build/ebpf-test/kernel.test build/ebpf-test/bpf-tests-clang-${{ matrix.llvm }}

      - name: Save BPF tests
        uses: actions/upload-artifact@v7
        with:
          name: bpf-tests-clang-${{ matrix.llvm }}
          path: build/ebpf-test/bpf-tests-clang-${{ matrix.llvm }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test:
    name: BPF Unit Test
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Download BPF tests
        uses: actions/download-artifact@v8
        with:
          pattern: bpf-tests-clang-*
          merge-multiple: true
          path: build/ebpf-test/

      - name: Prepare kernel tests
        run: |
          uname -r
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          mountpoint -q /sys/kernel/tracing || sudo mount -t tracefs tracefs /sys/kernel/tracing
          sudo modprobe br_netfilter

      - name: Run every compiler's BPF tests
        env:
          EXPECTED_ARTIFACTS: ${{ needs.build.outputs.artifacts }}
        run: |
          shopt -s nullglob
          tests=(build/ebpf-test/bpf-tests-clang-*)
          if (( EXPECTED_ARTIFACTS < 1 || ${#tests[@]} != EXPECTED_ARTIFACTS )); then
            echo "::error::Expected $EXPECTED_ARTIFACTS test binaries, found ${#tests[@]}"
            exit 1
          fi
          status=0
          for executable in "${tests[@]}"; do
            echo "::group::${executable##*/}"
            chmod +x "$executable"
            if ! sudo "$executable" -test.v -test.timeout=10m; then
              echo "::error::${executable##*/} failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
