name: BPF Test

on:
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "control/kern/tests/*.go"
      - ".github/workflows/bpf-test.yml"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "kern/headers"
  push:
    branches:
      - next
    paths:
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "control/kern/tests/*.go"
      - ".github/workflows/bpf-test.yml"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "kern/headers"

permissions: read-all

jobs:
  bpf_tests:
    name: BPF Unit Test (Clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [15, 16, 17, 18, 19, 20, 21, 22, 23]

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.0'

      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ matrix.llvm }}

      - name: Run BPF tests
        run: sudo env "PATH=$PATH" "CLANG=$CLANG" "STRIP=$STRIP" make ebpf-test
