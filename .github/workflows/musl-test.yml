name: Musl Static Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "third_party/**"
      - "plugins.cfg.example"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "Dockerfile"
      - "scripts/*"
      - ".github/actions/**"
      - ".github/workflows/musl-test.yml"
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.27.0'
      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install ELF tools and AddressSanitizer runtime
        run: sudo apt-get install -y binutils "libclang-rt-$LLVM_VERSION-dev"
      - name: Generate eBPF bindings
        run: make ebpf
      - name: Check native script memory management
        env:
          CGO_ENABLED: 1
        run: CC="$CLANG" go test -asan -tags=netgo,osusergo ./component/mitm/surge/...
      - name: Set up static musl toolchain
        uses: ./.github/actions/setup-musl
      - name: Build static daemon and script tests
        run: |
          make
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o surgemodule.test ./component/mitm/surge
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o quickjs.test ./component/mitm/surge/internal/quickjs
          scripts/check-static.sh dae surgemodule.test quickjs.test
      - name: Run on Alpine without host libraries
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/dae --version
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/surgemodule.test -test.timeout 3m
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/quickjs.test -test.timeout 3m
