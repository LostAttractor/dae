name: Musl Static Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "third_party/**"
      - "plugins.cfg.*"
      - "plugins/**"
      - "pkg/config_parser/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "web/**"
      - "Dockerfile"
      - "scripts/*"
      - ".github/actions/**"
      - ".github/workflows/musl-test.yml"
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mips64-softfloat:
    runs-on: ubuntu-24.04-arm
    env:
      GOARCH: mips64le
      GOMIPS64: softfloat
      GOWORK: 'off'
      PLUGINS_CONFIG: plugins.cfg.example
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.27.2'
      - uses: ./.github/actions/setup-llvm
      - run: sudo apt-get install -y binutils qemu-user cmake
      - uses: ./.github/actions/setup-musl
      - run: make
      - uses: ./.github/actions/smoke-musl
        with:
          executable: ./dae
      - name: Reject a mismatched floating-point ABI
        run: |
          if GOMIPS64=hardfloat scripts/check-static.sh dae; then exit 1; fi

  alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.27.2'
      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install ELF tools and AddressSanitizer runtime
        run: sudo apt-get install -y binutils "libclang-rt-$LLVM_VERSION-dev"
      - name: Generate eBPF bindings
        run: make ebpf
      - name: Check native script memory management
        env:
          CGO_ENABLED: 1
        run: CC="$CLANG" go test -asan -tags=netgo,osusergo ./plugins/surge/...
      - name: Set up static musl toolchain
        uses: ./.github/actions/setup-musl
      - name: Build static daemon and script tests
        run: |
          make
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o surgemodule.test ./plugins/surge
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o quickjs.test ./plugins/surge/internal/quickjs
          scripts/check-static.sh dae surgemodule.test quickjs.test
      - name: Run on Alpine without host libraries
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/dae --version
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/surgemodule.test -test.timeout 3m
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/quickjs.test -test.timeout 3m
