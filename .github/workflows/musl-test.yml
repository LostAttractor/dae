name: Musl Static Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Makefile"
      - "Dockerfile"
      - "scripts/*"
      - ".github/actions/**"
      - ".github/workflows/musl-test.yml"
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.27.0'
      - name: Install musl and eBPF tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools clang-15 llvm-15 binutils
      - name: Check native script memory management
        env:
          CGO_ENABLED: 1
        run: go test -asan -tags=netgo,osusergo ./component/mitm/surge/...
      - name: Build static daemon and script tests
        env:
          CGO_ENABLED: 1
          CC: musl-gcc
        run: |
          make STATIC=y CLANG=clang-15 STRIP=llvm-strip-15
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o surgemodule.test ./component/mitm/surge
          go test -c -tags=netgo,osusergo \
            -ldflags="-s -w -linkmode=external -extldflags '-static -Wl,-z,stack-size=2097152'" \
            -o quickjs.test ./component/mitm/surge/internal/quickjs
          scripts/check-static.sh dae surgemodule.test quickjs.test
      - name: Run on Alpine without host libraries
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/dae --version
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/surgemodule.test -test.timeout 3m
          docker run --rm --network none -v "$PWD:/work:ro" alpine:3.23 \
            /work/quickjs.test -test.timeout 3m
