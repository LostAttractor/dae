name: Go Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "component/mitm/surge/**/*.js"
      - "client/**"
      - "web/**"
      - "plugins.cfg.example"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "scripts/update-http2.py"
      - "scripts/http2/**"
      - "internal/http2/**"
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "component/mitm/surge/**/*.js"
      - "client/**"
      - "web/**"
      - "plugins.cfg.example"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
      - ".github/actions/setup-llvm/**"
      - "scripts/setup-llvm.sh"
      - "scripts/update-http2.py"
      - "scripts/http2/**"
      - "internal/http2/**"

permissions: read-all

jobs:
  http-protocols:
    name: HTTP protocol contracts (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.0', 'stable']
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            third_party/quic-go/go.sum
      - name: Verify pinned HTTP/2 sources
        shell: bash
        run: |
          source_version=$(python3 -c 'import json; print(json.load(open("internal/http2/upstream.json"))["version"])')
          source_root=$(GOTOOLCHAIN="$source_version" go env GOROOT)
          python3 scripts/update-http2.py --goroot "$source_root" --check
      - name: Test HTTP adapters and proxy behavior
        run: go test -race ./internal/http2/... ./component/mitm -count=1
      - name: Test QUIC and HTTP/3 completion contracts
        working-directory: third_party/quic-go
        run: go test -race . ./http3 -count=1

  go-test:
    name: Go Unit Test (${{ matrix.surge-runtime }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        surge-runtime: [quickjs, nodejs]
    env:
      SURGE_RUNTIME: ${{ matrix.surge-runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build standalone Web assets
        run: make web

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.0'

      - name: Test standalone API clients
        run: make client-test

      - name: Test API server without daemon dependencies
        run: CGO_ENABLED=0 go test ./internal/apiserver

      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm

      - name: Run tests
        run: CC="$CLANG" make test

      - name: Check runtime dependency isolation
        shell: bash
        run: |
          if [[ "$SURGE_RUNTIME" == nodejs ]]; then
            rm -rf third_party/quickjs-go
            CGO_ENABLED=0 go build -tags=surge_nodejs -o /tmp/dae-nodejs .
            deps=$(CGO_ENABLED=0 go list -tags=surge_nodejs -deps -f '{{if or .CgoFiles (eq .ImportPath "github.com/buke/quickjs-go")}}{{.ImportPath}}{{end}}' .)
            test -z "$deps"
          else
            deps=$(go list -deps ./component/mitm/surge)
            if [[ "$deps" == *'/internal/nodejs'* ]]; then
              echo 'QuickJS build includes the Node.js adapter' >&2
              exit 1
            fi
          fi
