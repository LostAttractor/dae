name: Go Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "client/**"
      - "web/**"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "client/**"
      - "web/**"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"

permissions: read-all

jobs:
  go-test:
    name: Go Unit Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build standalone Web assets
        run: make web

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.0'

      - name: Test standalone API clients
        run: make client-test

      - name: Test API server without daemon dependencies
        run: CGO_ENABLED=0 go test ./internal/apiserver

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Run tests
        run: make test CLANG=clang-15 STRIP=llvm-strip-15
