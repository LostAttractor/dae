name: Go Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"

permissions: read-all

jobs:
  go-test:
    name: Go Unit Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.25.7'

      - name: Run tests
        run: go test ./...
