name: Go Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "component/mitm/surge/**/*.js"
      - "client/**"
      - "web/**"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "component/mitm/surge/**/*.js"
      - "client/**"
      - "web/**"
      - "docs/api/openapi.json"
      - "**/*.c"
      - "**/*.h"
      - "kern/headers"
      - ".gitmodules"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-test.yml"
      - "Makefile"

permissions: read-all

jobs:
  go-test:
    name: Go Unit Test (${{ matrix.surge-runtime }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        surge-runtime: [quickjs, nodejs]
    env:
      SURGE_RUNTIME: ${{ matrix.surge-runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build standalone Web assets
        run: make web

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.0'

      - name: Test standalone API clients
        run: make client-test

      - name: Test API server without daemon dependencies
        run: CGO_ENABLED=0 go test ./internal/apiserver

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Run tests
        run: make test CLANG=clang-15 STRIP=llvm-strip-15

      - name: Check runtime dependency isolation
        shell: bash
        run: |
          if [[ "$SURGE_RUNTIME" == nodejs ]]; then
            rm -rf third_party/quickjs-go
            CGO_ENABLED=0 go build -tags=surge_nodejs -o /tmp/dae-nodejs .
            deps=$(CGO_ENABLED=0 go list -tags=surge_nodejs -deps -f '{{if or .CgoFiles (eq .ImportPath "github.com/buke/quickjs-go")}}{{.ImportPath}}{{end}}' .)
            test -z "$deps"
          else
            deps=$(go list -deps ./component/mitm/surge)
            if [[ "$deps" == *'/internal/nodejs'* ]]; then
              echo 'QuickJS build includes the Node.js adapter' >&2
              exit 1
            fi
          fi
