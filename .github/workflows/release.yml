name: Publish Release
run-name: Publish Release tag ${{ inputs.tag }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/seed-build.yml
    with:
      ref: ${{ inputs.tag }}
      build-type: release-build

  upload-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release binaries and checksums
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release/
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          prerelease: false
