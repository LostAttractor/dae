name: Publish container image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false
  push:
    branches:
      - next
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "third_party/**"
      - "web/**"
      - "plugins.cfg.*"
      - "plugins/**"
      - "pkg/config_parser/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/setup-llvm.sh"
      - "scripts/setup-zig.sh"
      - "scripts/zig-cc.sh"
      - "scripts/check-static.sh"
      - "scripts/publish-container-index.py"
      - "scripts/tests/test_container_publish.py"
      - "Makefile"
      - ".github/workflows/docker.yml"
      - "kern/headers"
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: ghcr-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Resolve image metadata
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.prep.outputs.IMAGE }}
      commit: ${{ steps.prep.outputs.COMMIT }}
      version: ${{ steps.prep.outputs.VERSION }}
      tags: ${{ steps.prep.outputs.TAGS }}
      matrix: ${{ steps.prep.outputs.MATRIX }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
      - name: Test image publication
        run: python3 scripts/tests/test_container_publish.py
      - name: Prepare
        id: prep
        env:
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          IS_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit=$(git rev-parse HEAD)
          tags=("$image:sha-${commit:0:12}")
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$RELEASE_TAG" != v* ]]; then
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            tag=${RELEASE_TAG#v}
            version=$RELEASE_TAG
            if [[ "$IS_PRERELEASE" != true ]]; then
              tags+=("$image:latest")
            fi
          elif [[ "$REF" == "refs/tags/v"* ]]; then
            tag=${REF#refs/tags/v}
            version=${REF#refs/tags/}
          else
            date=$(git log -1 --format=%cd --date=format:%Y%m%d)
            version="unstable-${date}.${commit:0:12}"
            tag="sha-${commit:0:12}"
            if [[ "$REF" == refs/heads/next ]]; then
              tags+=("$image:next")
            fi
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Release tag cannot be used as a container tag: $tag" >&2
            exit 1
          fi
          if [[ "$tag" != "sha-${commit:0:12}" ]]; then
            tags+=("$image:$tag")
          fi
          matrix=$(jq -cn '
            {include: ["linux/amd64", "linux/arm64", "linux/arm/v7", "linux/386"]
              | map({platform: ., id: gsub("/"; "-")})}
          ')
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
            echo "COMMIT=$commit"
            echo "MATRIX=$matrix"
            echo 'TAGS<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build image (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout resolved source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=container-${{ matrix.id }}
          cache-to: type=gha,scope=container-${{ matrix.id }},mode=max
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_ID: ${{ matrix.id }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$PLATFORM_ID.digest"
      - name: Upload image digest
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.id }}
          path: ${{ runner.temp }}/digests/*.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout resolved source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate platforms and publish tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: python3 scripts/publish-container-index.py
