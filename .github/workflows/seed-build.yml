name: Build binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      pr-number:
        type: number
        default: 0
      build-type:
        type: string
        description: "pr-build, main-build, daily-build, or release-build"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve source and build targets
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Test release checksums
        run: python3 scripts/tests/test_release_pipeline.py
      - name: Resolve build metadata
        id: metadata
        env:
          BUILD_REF: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build-type || 'main-build' }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          commit=$(git rev-parse HEAD)
          date=$(git log -1 --format=%cd --date=format:%Y%m%d)
          case "$BUILD_TYPE" in
            release-build) version=$BUILD_REF ;;
            pr-build)
              count=$(git rev-list --count origin/next..HEAD)
              version="unstable-${date}.pr-${PR_NUMBER}.r${count}.${commit:0:6}"
              ;;
            main-build|daily-build)
              count=$(git rev-list --count HEAD)
              version="unstable-${date}.r${count}.${commit:0:6}"
              ;;
            *) echo "Unknown build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          matrix=$(jq -ce '
            if length > 0 and ([.[].name] | length == (unique | length))
            then {include: .} else error("release target names must be unique") end
          ' install/release-targets.json)
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build embedded Web assets once
        run: make -C web DIST="$PWD/internal/webui/assets"
      - name: Save embedded Web assets
        uses: actions/upload-artifact@v7
        with:
          name: embedded-web-assets
          path: internal/webui/assets/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  build:
    name: Build and validate (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.name == 'linux-armv5' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}
      GORISCV64: ${{ matrix.goriscv64 }}
      GOFLAGS: -trimpath -modcacherw
      GOWORK: 'off'
      PLUGINS_CONFIG: plugins.cfg.example
      VERSION: ${{ needs.prepare.outputs.version }}
      OUTPUT: build/dae-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download embedded Web assets
        uses: actions/download-artifact@v8
        with:
          name: embedded-web-assets
          path: internal/webui/assets/
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.2'
      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm
      - name: Install ELF tools and target emulators
        run: sudo apt-get install -y binutils qemu-user
      - name: Set up musl cross-compiler
        uses: ./.github/actions/setup-musl
      - name: Download Go dependencies
        run: go mod download
      - name: Build dae
        run: |
          test -s internal/webui/assets/index.html
          make -o web-assets
      - name: Validate static binary and QuickJS on target
        uses: ./.github/actions/smoke-musl
        with:
          executable: ${{ env.OUTPUT }}
      - name: Create release checksums
        if: inputs.build-type == 'release-build'
        run: scripts/release-checksums.sh "$OUTPUT"
      - name: Save validated binary
        uses: actions/upload-artifact@v7
        with:
          name: dae-${{ matrix.name }}
          path: ${{ env.OUTPUT }}
          archive: false
          if-no-files-found: error
          overwrite: true
      - name: Save release checksums
        if: inputs.build-type == 'release-build'
        uses: actions/upload-artifact@v7
        with:
          name: dae-${{ matrix.name }}.dgst
          path: ${{ env.OUTPUT }}.dgst
          archive: false
          if-no-files-found: error
          overwrite: true
