name: Build binaries

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      pr-number:
        type: number
        default: 0
      build-type:
        type: string
        description: "pr-build, main-build, daily-build, or release-build"
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve source and build targets
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Test release checksums
        run: python3 scripts/tests/test_release_pipeline.py
      - name: Resolve build metadata
        id: metadata
        env:
          BUILD_REF: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build-type }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          commit=$(git rev-parse HEAD)
          date=$(git log -1 --format=%cd --date=format:%Y%m%d)
          case "$BUILD_TYPE" in
            release-build) version=$BUILD_REF ;;
            pr-build)
              count=$(git rev-list --count origin/next..HEAD)
              version="unstable-${date}.pr-${PR_NUMBER}.r${count}.${commit:0:6}"
              ;;
            main-build|daily-build)
              count=$(git rev-list --count HEAD)
              version="unstable-${date}.r${count}.${commit:0:6}"
              ;;
            *) echo "Unknown build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          matrix=$(jq -ce '
            if length > 0 and ([.[].name] | length == (unique | length))
            then {include: .} else error("release target names must be unique") end
          ' install/release-targets.json)
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and validate (${{ matrix.name }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}
      GORISCV64: ${{ matrix.goriscv64 }}
      GOFLAGS: -trimpath -modcacherw
      VERSION: ${{ needs.prepare.outputs.version }}
      OUTPUT: build/dae-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: |
            go.mod
            go.sum
          go-version: '>=1.27.0'
      - name: Install host LLVM
        uses: ./.github/actions/setup-llvm
      - name: Install ELF tools and target emulators
        run: sudo apt-get install -y binutils qemu-user
      - name: Set up musl cross-compiler
        uses: ./.github/actions/setup-musl
      - name: Download Go dependencies
        run: go mod download
      - name: Build dae
        run: make
      - name: Validate static binary and QuickJS on target
        uses: ./.github/actions/smoke-musl
        with:
          executable: ${{ env.OUTPUT }}
      - name: Create release checksums
        if: inputs.build-type == 'release-build'
        run: scripts/release-checksums.sh "$OUTPUT"
      - name: Save validated binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.build-type == 'release-build' && 'release' || 'binary' }}-${{ matrix.name }}
          path: ${{ env.OUTPUT }}*
          if-no-files-found: error
          overwrite: true

  report:
    name: Report preview result
    if: always() && inputs.build-type == 'pr-build' && startsWith(github.event.pull_request.head.repo.full_name, github.repository_owner)
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check phase results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done
      - name: Report result
        if: always()
        uses: daeuniverse/ci-seed-jobs/common/report-check-run@master
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          id: "dae-bot[bot]/build"
