name: Check Documents

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [next]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'plugins/**/*.md'
      - 'pkg/outbound/README.md'
      - 'component/plugin/README.md'
      - 'hack/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'web/package.json'
      - '.autocorrectrc'
      - '.markdownlint.jsonc'
      - '.github/workflows/check-docs.yml'

permissions:
  contents: read

jobs:
  check-doc:
    name: Check document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Test documentation tools
        run: pnpm run test-doc-tools
      - name: Lint Markdown files (markdownlint)
        run: |
          pnpm run markdown-lint
      - name: Lint Markdown files (autocorrect)
        uses: huacnlee/autocorrect-action@main
        with:
          args: --lint ./docs/
      - name: Check broken link (including broken anchor)
        run: |
          pnpm run check-broken-link
